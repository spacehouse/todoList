# 1.21.x version matrix
# Single source of truth for build-time version selection on the 1.21.x branch.
# Format: <mc-version>.<field>=<value>
# All profiles share Gradle 8.11.1 + Loom 1.13.467 + Java 21, so no per-profile
# java_version / gradle_version / loom_version fields are needed here.
# api_group selects the override source set directory: v1_21_1 (baseline, no override),
# v1_21_2, v1_21_4, v1_21_5, v1_21_6. See 1.21.x-porting-plan.md section 4 for details.
# Profiles with build_supported=false are placeholders: their versions marked as
# "calibrate" comments must be verified (plan appendix A channels) before enabling.

# 1.21.1 (G1) - released baseline, all values verified against gradle.properties
1.21.1.build_supported=true
1.21.1.api_group=v1_21_1
1.21.1.minecraft_version=1.21.1
1.21.1.loader_version=0.18.1
1.21.1.fabric_api_version=0.116.9+1.21.1
1.21.1.neoforge_version=21.1.219
1.21.1.forge_version=52.1.10
1.21.1.modmenu_version=11.0.3
1.21.1.fabric_loader_dependency=>=0.18.1
1.21.1.fabric_minecraft_dependency=1.21.1
1.21.1.minecraft_version_range=[1.21.1]
1.21.1.forge_loader_range=[52,)
1.21.1.neoforge_loader_range=[21.1,)
1.21.1.forge_supported=true
1.21.1.status=stable-baseline

