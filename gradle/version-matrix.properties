# 1.21.9-1.21.11 version matrix (branch 1.21.9-1.21.11)
# Single source of truth for build-time version selection on this branch.
# Format: <mc-version>.<field>=<value>
# Profiles share Java 21; loom/Gradle versions will be upgraded together in P1
# (see 1.21.9-1.21.11-porting-plan.md section 4.3), so no per-profile
# java_version / gradle_version / loom_version fields are needed here.
# api_group selects the override source set directory: v1_21_1 (baseline, no override),
# v1_21_11. See 1.21.9-1.21.11-porting-plan.md section 4 for details.
# Profiles with build_supported=false are placeholders: their versions marked as
# TBD-CALIBRATE must be verified (plan appendix A channels) before enabling.

