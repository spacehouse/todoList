# 26.1.x version matrix (branch 26.1.x)
# Single source of truth for build-time version selection on this branch.
# Format: <mc-version>.<field>=<value>
# Profiles share Java 25 and Gradle 9.5.0; Minecraft 26.1+ is unobfuscated,
# so the build uses dev.architectury.loom-no-remap and no mappings configuration.
# api_group selects the override source set directory: baseline (no override),
# v26_1_0 / v26_1_1 / v26_1_2 for hotfix-specific differences if needed.
# 26.1.2 values calibrated on 2026-11-13; 26.1 / 26.1.1 stay build_supported=false
# until P3 online calibration fills the exact Fabric API / ModMenu / NeoForge builds.

# 26.1.2 - calibrated baseline for P0/P1/P2
26.1.2.build_supported=true
26.1.2.api_group=baseline
26.1.2.minecraft_version=26.1.2
26.1.2.loader_version=0.20.1
26.1.2.fabric_api_version=0.155.3+26.1.2
26.1.2.neoforge_version=26.1.2.126
26.1.2.forge_version=none
26.1.2.modmenu_version=18.0.2
26.1.2.fabric_loader_dependency=>=0.20.1
26.1.2.fabric_minecraft_dependency=>=26.1.2 <26.2
26.1.2.minecraft_version_range=[26.1.2,26.2)
26.1.2.forge_loader_range=none
26.1.2.neoforge_loader_range=[26.1.2,)
26.1.2.forge_supported=false
26.1.2.status=calibrated-p0

# 26.1 - calibrated (P3, 2026-11-14): fabric-api/ModMenu share the 26.1.2 build;
# v26_1_pre override group keeps the pre-rename BlockEvent.BreakEvent for the 26.1.0 / 26.1.1 NeoForge lines
# (declares whole-line support); NeoForge line stays beta-only (26.1.0.19-beta line final)
26.1.build_supported=true
26.1.api_group=v26_1_pre
26.1.minecraft_version=26.1
26.1.loader_version=0.20.1
26.1.fabric_api_version=0.155.3+26.1.2
26.1.neoforge_version=26.1.0.19-beta
26.1.forge_version=none
26.1.modmenu_version=18.0.2
26.1.fabric_loader_dependency=>=0.20.1
26.1.fabric_minecraft_dependency=>=26.1 <26.2
26.1.minecraft_version_range=[26.1,26.2)
26.1.forge_loader_range=none
26.1.neoforge_loader_range=[26.1,)
26.1.forge_supported=false
26.1.status=calibrated-p3

