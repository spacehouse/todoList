# 1.21.9-1.21.11 version matrix (branch 1.21.9-1.21.11)
# Single source of truth for build-time version selection on this branch.
# Format: <mc-version>.<field>=<value>
# Profiles share Java 21; toolchain (loom 1.17.491 / Gradle 9.5.0) is upgraded
# together in P1 (see 1.21.9-1.21.11-porting-plan.md section 4.3), so no
# per-profile java_version / gradle_version / loom_version fields are needed.
# api_group selects the override source set directory: v1_21_1 (baseline, no override),
# v1_21_11. See 1.21.9-1.21.11-porting-plan.md section 4 for details.
# Versions calibrated online on 2026-09-08 (P1):
#   fabric-api via Modrinth API, NeoForge via maven.neoforged.net POMs,
#   ModMenu via Modrinth API, loader kept at the 1.21.1-branch proven 0.18.1.
# 1.21.10 / 1.21.11 stay build_supported=false until P3 / P4 enable them.

