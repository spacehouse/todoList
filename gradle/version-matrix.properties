# 26.3 version matrix (branch 26.3)
# Single source of truth for build-time version selection on this branch.
# Format: <mc-version>.<field>=<value>
# Profiles share Java 25 and Gradle 9.5.0; Minecraft 26.x is unobfuscated,
# so the build uses dev.architectury.loom-no-remap and no mappings configuration.
# api_group selects the override source set directory: baseline (no override),
# v26_3 for 26.3-specific differences if compile errors require it.
# Values calibrated on 2026-11-14 (Modrinth API / NeoForged maven metadata).

# 26.3 - calibrated; NeoForge line ends at 26.3.0.103; MC 26.3 moved fuels /
