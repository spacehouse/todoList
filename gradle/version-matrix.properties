# 26.1.x version matrix (branch 26.1.x)
# Single source of truth for build-time version selection on this branch.
# Format: <mc-version>.<field>=<value>
# Profiles share Java 25 and Gradle 9.5.0; Minecraft 26.1+ is unobfuscated,
# so the build uses dev.architectury.loom-no-remap and no mappings configuration.
# api_group selects the override source set directory: baseline (no override),
# v26_1_0 / v26_1_1 / v26_1_2 for hotfix-specific differences if needed.
# 26.1.2 values calibrated on 2026-11-13; 26.1 / 26.1.1 stay build_supported=false
# until P3 online calibration fills the exact Fabric API / ModMenu / NeoForge builds.

# 26.1.2 - calibrated baseline for P0/P1/P2
