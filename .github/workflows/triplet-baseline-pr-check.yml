name: triplet-baseline-pr-check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-baseline-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR checklist for triplet baseline updates
        uses: actions/github-script@v7
        with:
          script: |
            const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const checklistItems = [
              '已给出差异来源说明：涉及命令、字段、预期行为、影响范围',
              '已确认变更与需求/设计一致，并附上关联链接',
              '已检查 `build/reports/triplet-diff.json`，确认无未解释差异',
              '已同步更新文档入口：`USAGE.md` / `CI-SYNC-RULES.md` / `BASELINE-UPDATE-FLOW.md`',
              '提交信息已使用 `[triplet-baseline]` 模板并补充回退策略'
            ];

            const baselineFilePattern = /^tools\/triplet-compare\/.*baseline.*\.json$/i;
            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            );

            const baselineFiles = changedFiles
              .map((file) => file.filename)
              .filter((filename) => baselineFilePattern.test(filename));

            if (baselineFiles.length === 0) {
              core.info('No triplet baseline file changes detected; checklist validation skipped.');
              return;
            }

            const body = context.payload.pull_request?.body ?? '';
            const missingItems = checklistItems.filter((item) => {
              const itemRegex = new RegExp(`-\\s*\\[(?:x|X)\\]\\s*${escapeRegex(item)}`);
              return !itemRegex.test(body);
            });

            if (missingItems.length > 0) {
              core.setFailed(
                [
                  `Detected triplet baseline file changes: ${baselineFiles.join(', ')}`,
                  'PR body is missing required checked checklist items:',
                  ...missingItems.map((item) => `- [ ] ${item}`),
                  'Please check all required items in .github/pull_request_template.md before merge.'
                ].join('\n')
              );
              return;
            }

            core.info(`Detected triplet baseline file changes: ${baselineFiles.join(', ')}`);
            core.info('All required triplet baseline checklist items are checked.');
