name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Prepare Release Metadata
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GAME_VERSION="$(sed -n 's/^minecraft_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1 | tr -d '\r' | xargs)"
          if [ -z "$GAME_VERSION" ]; then
            echo "Failed to resolve minecraft_version from gradle.properties" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "game_version=${GAME_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=TodoList-v${VERSION}-mc${GAME_VERSION}-release" >> "$GITHUB_OUTPUT"
          echo "fabric_publish_name=TodoList-v${VERSION}-mc${GAME_VERSION}-Fabric" >> "$GITHUB_OUTPUT"
          echo "fabric_publish_version=${VERSION}-mc${GAME_VERSION}-fabric" >> "$GITHUB_OUTPUT"
          echo "forge_publish_name=TodoList-v${VERSION}-mc${GAME_VERSION}-Forge" >> "$GITHUB_OUTPUT"
          echo "forge_publish_version=${VERSION}-mc${GAME_VERSION}-forge" >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes
        id: extract_changelog
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES="$(awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\\\?\\[" v "\\]([[:space:]]*-.*)?$" { in_section = 1; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' CHANGELOG.md)"
          NOTES="$(printf "%s\n" "$NOTES" | sed '/./,$!d')"
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
          {
            echo "release_notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.release_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.release_notes }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-dev.jar

      - name: Publish Fabric Version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ steps.meta.outputs.fabric_publish_name }}
          version: ${{ steps.meta.outputs.fabric_publish_version }}
          changelog: "${{ steps.extract_changelog.outputs.release_notes }}"

          files: build/libs/*-fabric-*!(*-dev|*-sources|*-javadoc).jar

          curseforge-id: 1476043
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: RcGBxDyt
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          loaders: fabric
          game-versions: ${{ steps.meta.outputs.game_version }}

      - name: Publish Forge Version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ${{ steps.meta.outputs.forge_publish_name }}
          version: ${{ steps.meta.outputs.forge_publish_version }}
          changelog: "${{ steps.extract_changelog.outputs.release_notes }}"

          files: build/libs/*-forge-*!(*-dev|*-sources|*-javadoc).jar

          curseforge-id: 1476043
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: RcGBxDyt
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          loaders: forge
          game-versions: ${{ steps.meta.outputs.game_version }}

      - name: Publish NeoForge Version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: "TodoList-v${{ steps.meta.outputs.version }}-mc${{ steps.meta.outputs.game_version }}-NeoForge"
          version: "${{ steps.meta.outputs.version }}-mc${{ steps.meta.outputs.game_version }}-neoforge"
          changelog: "${{ steps.extract_changelog.outputs.release_notes }}"

          files: build/libs/*-neoforge-*!(*-dev|*-sources|*-javadoc).jar

          curseforge-id: 1476043
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: RcGBxDyt
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          loaders: neoforge
          game-versions: ${{ steps.meta.outputs.game_version }}
