name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Prepare Release Metadata
        id: meta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=TodoList-v${VERSION}-release" >> "$GITHUB_OUTPUT"

      - name: Extract Release Notes
        id: extract_changelog
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES="$(awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\\\?\\[" v "\\]([[:space:]]*-.*)?$" { in_section = 1; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' CHANGELOG.md)"
          NOTES="$(printf "%s\n" "$NOTES" | sed '/./,$!d')"
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
          {
            echo "release_notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.release_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.release_notes }}
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-dev.jar

      - name: Publish Fabric Version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: "TodoList-${{ github.ref_name }}-Fabric"
          version: "${{ github.ref_name }}-fabric"
          changelog: "${{ steps.extract_changelog.outputs.release_notes }}"

          files: build/libs/*-fabric-*!(*-dev|*-sources|*-javadoc).jar

          curseforge-id: 1476043
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: RcGBxDyt
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          loaders: fabric
          game-versions: 1.21.1

      - name: Publish Forge Version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: "TodoList-${{ github.ref_name }}-Forge"
          version: "${{ github.ref_name }}-forge"
          changelog: "${{ steps.extract_changelog.outputs.release_notes }}"

          files: build/libs/*-forge-*!(*-dev|*-sources|*-javadoc).jar

          curseforge-id: 1476043
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: RcGBxDyt
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          loaders: forge
          game-versions: 1.21.1

      - name: Publish NeoForge Version
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: "TodoList-${{ github.ref_name }}-NeoForge"
          version: "${{ github.ref_name }}-neoforge"
          changelog: "${{ steps.extract_changelog.outputs.release_notes }}"

          files: build/libs/*-neoforge-*!(*-dev|*-sources|*-javadoc).jar

          curseforge-id: 1476043
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: RcGBxDyt
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          loaders: neoforge
          game-versions: 1.21.1
