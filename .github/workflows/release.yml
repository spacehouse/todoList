name: release

# 1.21.x 分支发布工作流：单 tag 齐发多个 MC 版本（各 fabric + neoforge 双端），
# 同步推送 GitHub Release / CurseForge / Modrinth。
# tag 形态：v<mod_version>-mc<版本1>-<版本2>-...（如 v1.4.1-mc1.21.2-1.21.3），
# 采用子集语义：tag 列出哪些版本就发布哪些版本（用于补发历史版本，如 1.21.2~1.21.8），
# 每个 tag 版本必须是 gradle/version-matrix.properties 中 build_supported=true 的 profile。

on:
  push:
    tags:
      - 'v*'

jobs:
  # 阶段一：从 tag 解析待发布版本清单，并逐项校验矩阵开闸状态
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.meta.outputs.mod_version }}
      profiles: ${{ steps.meta.outputs.profiles }}
      profiles_csv: ${{ steps.meta.outputs.profiles_csv }}
      release_name: ${{ steps.meta.outputs.release_name }}
      publish_combos: ${{ steps.meta.outputs.publish_combos }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Release Metadata
        id: meta
        shell: bash
        run: |
          set -eu
          MOD_VERSION="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1 | tr -d '\r' | xargs)"
          if [ -z "$MOD_VERSION" ]; then
            echo "Failed to resolve mod_version from gradle.properties" >&2
            exit 1
          fi
          EXPECTED_PREFIX="v${MOD_VERSION}-mc"
          TAG="${GITHUB_REF_NAME}"
          if [[ "${TAG}" != "${EXPECTED_PREFIX}"* ]]; then
            echo "Tag ${TAG} does not start with expected prefix ${EXPECTED_PREFIX}" >&2
            exit 1
          fi
          VERSIONS_CSV="${TAG#${EXPECTED_PREFIX}}"
          if [ -z "${VERSIONS_CSV}" ]; then
            echo "Tag contains no minecraft versions" >&2
            exit 1
          fi
          mapfile -t PROFILE_LIST < <(tr '-' '\n' <<< "${VERSIONS_CSV}" | sed '/^$/d')
          # 去重校验
          if [ "$(printf '%s\n' "${PROFILE_LIST[@]}" | sort -u | wc -l)" -ne "${#PROFILE_LIST[@]}" ]; then
            echo "Tag contains duplicate minecraft versions" >&2
            exit 1
          fi
          # 逐项校验：tag 版本必须为矩阵中 build_supported=true 的 profile
          SUPPORTED_LIST="$(sed -n 's/^\([0-9][0-9.]*\)\.build_supported[[:space:]]*=[[:space:]]*true[[:space:]]*$/\1/p' gradle/version-matrix.properties | sort -V)"
          for V in "${PROFILE_LIST[@]}"; do
            if ! grep -qxF "${V}" <<< "${SUPPORTED_LIST}"; then
              echo "Version ${V} from tag is not build_supported=true in gradle/version-matrix.properties" >&2
              exit 1
            fi
          done
          # 发布组合：fabric/neoforge 恒推，forge 按矩阵 forge_supported 动态追加
          COMBO_ITEMS=""
          for V in "${PROFILE_LIST[@]}"; do
            ESC_V="$(printf '%s' "${V}" | sed 's/[.]/\\./g')"
            for L in fabric neoforge; do
              COMBO_ITEMS+="${COMBO_ITEMS:+,}{\"profile\":\"${V}\",\"loader\":\"${L}\"}"
            done
            if grep -qE "^${ESC_V}\.forge_supported[[:space:]]*=[[:space:]]*true[[:space:]]*$" gradle/version-matrix.properties; then
              COMBO_ITEMS+=",{\"profile\":\"${V}\",\"loader\":\"forge\"}"
            fi
          done
          PROFILES_JSON="$(printf '%s\n' "${PROFILE_LIST[@]}" | jq -R . | jq -sc .)"
          {
            echo "mod_version=${MOD_VERSION}"
            echo "profiles=${PROFILES_JSON}"
            echo "profiles_csv=${VERSIONS_CSV}"
            echo "release_name=TodoList-v${MOD_VERSION}-mc${VERSIONS_CSV}-release"
            echo "publish_combos={\"include\":[${COMBO_ITEMS}]}"
          } >> "$GITHUB_OUTPUT"

  # 阶段二：逐 profile 构建（等价 build-local-121x.bat 的矩阵属性注入），
  # distReleaseJars 聚合双端 jar 至根 build/libs，h2JarContentCheck 做 jar 内容守卫
  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.resolve.outputs.profiles) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Profile ${{ matrix.profile }}
        shell: bash
        run: |
          set -eu
          PROFILE="${{ matrix.profile }}"
          MATRIX_FILE=gradle/version-matrix.properties
          # profile 键含点号，sed 模式需转义后再拼前缀
          ESC_PROFILE="$(printf '%s' "$PROFILE" | sed 's/[.]/\\./g')"
          field() {
            sed -n "s/^${ESC_PROFILE}\.$1[[:space:]]*=[[:space:]]*//p" "$MATRIX_FILE" | head -n 1 | tr -d '\r' | xargs
          }
          # 根 build 聚合全子项目（含 :common:check 全量自测），distReleaseJars
          # 聚合双端 jar 至根 build/libs，h2JarContentCheck 做 jar 内容守卫
          ./gradlew build distReleaseJars h2JarContentCheck --stacktrace --no-daemon \
            "-Ptarget_matrix_profile=${PROFILE}" \
            "-Ptarget_minecraft_version=$(field minecraft_version)" \
            "-Ptarget_loader_version=$(field loader_version)" \
            "-Ptarget_fabric_api_version=$(field fabric_api_version)" \
            "-Ptarget_neoforge_version=$(field neoforge_version)" \
            "-Ptarget_forge_version=$(field forge_version)" \
            "-Ptarget_modmenu_version=$(field modmenu_version)" \
            "-Ptarget_fabric_loader_dependency=$(field fabric_loader_dependency)" \
            "-Ptarget_fabric_minecraft_dependency=$(field fabric_minecraft_dependency)" \
            "-Ptarget_minecraft_version_range=$(field minecraft_version_range)" \
            "-Ptarget_forge_loader_range=$(field forge_loader_range)" \
            "-Ptarget_neoforge_loader_range=$(field neoforge_loader_range)" \
            "-Ptarget_forge_supported=$(field forge_supported)" \
            "-Ptarget_api_group=$(field api_group)"
          ls -l build/libs

      - name: Upload Release Jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.profile }}
          path: build/libs/*.jar
          if-no-files-found: error

  # 阶段三：GitHub Release（单 release 挂全部 jar，发布说明取 CHANGELOG 对应版本节）
  github-release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release Jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: jars-*
          merge-multiple: true

      - name: Extract Release Notes
        id: extract_changelog
        shell: bash
        run: |
          VERSION="${{ needs.resolve.outputs.mod_version }}"
          NOTES="$(awk -v v="$VERSION" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\\\?\\[" v "\\]([[:space:]]*-.*)?$" { in_section = 1; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' CHANGELOG.md)"
          NOTES="$(printf "%s\n" "$NOTES" | sed '/./,$!d')"
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
          {
            echo "release_notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.resolve.outputs.release_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.release_notes }}
          files: jars/*.jar

  # 阶段四：CurseForge + Modrinth（profile × loader 矩阵同步推送）
  publish-mod:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.publish_combos) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release Jars
        uses: actions/download-artifact@v4
        with:
          path: jars
          pattern: jars-*
          merge-multiple: true

      - name: Publish ${{ matrix.loader }} Version for ${{ matrix.profile }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: TodoList-v${{ needs.resolve.outputs.mod_version }}-mc${{ matrix.profile }}-${{ matrix.loader }}
          version: ${{ needs.resolve.outputs.mod_version }}-mc${{ matrix.profile }}-${{ matrix.loader }}
          changelog: "Released by tag ${{ github.ref_name }}; see GitHub Release notes."

          files: jars/todolist-${{ matrix.loader }}-${{ matrix.profile }}-*.jar

          curseforge-id: 1476043
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: RcGBxDyt
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.profile }}
